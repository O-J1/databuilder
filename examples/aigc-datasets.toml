# Curated AIGC corpus. Revisions and label/generator mappings were audited
# against the Hugging Face dataset cards/schemas in July 2026.
# Run this only on the destination machine; the snapshot stage is rank 0 only.

[runtime]
data_dir = "/p/data1/datasets/mmlaion/aigc/data"
work_dir = "/p/data1/datasets/mmlaion/aigc/data/.databuilder-work"
num_workers = 16

[download]
# One Hugging Face snapshot worker means one dataset-file transfer at a time.
max_workers = 1
xet_high_performance = false

