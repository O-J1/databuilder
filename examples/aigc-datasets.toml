label = "column:label"
generator = "column:model"
columns = { image = "image" }
# The maintainers acknowledged unresolved image/prompt mispairing for the first
# four model groups. SANA rows are separately reported as invalid noise images.
# String exclusions are case-insensitive and happen before image decoding.
